name: Deploy via FTP na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositorio
        uses: actions/checkout@v4

      # Site estatico: so o index.html vai para o servidor (sem build)
      - name: Preparar arquivos do site
        run: |
          mkdir -p public
          cp index.html public/
          ls -al public/

      - name: Deploy FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          protocol: ftp
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./public/
          server-dir: ./
          dangerous-clean-slate: false
          dry-run: false
          log-level: standard
